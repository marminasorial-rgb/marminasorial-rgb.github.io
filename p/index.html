<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ========================================================= -->
    <!--  وسوم المعاينة وصورة الشير (Open Graph) للواتساب وفيسبوك  -->
    <!--  (تم الحفاظ عليها بالكامل بدون أي تعديل)                  -->
    <!-- ========================================================= -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="شارك و شاهد" />
    <meta property="og:title" content="افتح المحتوى المباشر في التطبيق" />
    <meta property="og:description" content="اضغط هنا للفتح داخل التطبيق." />
    <meta property="og:image" content="https://marminasorial-rgb.github.io/p/preview.png" />
    <meta property="og:image:secure_url" content="https://marminasorial-rgb.github.io/p/preview.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://marminasorial-rgb.github.io/p/" />

    <!-- وسوم لمنصة X (تويتر) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="افتح المحتوى المباشر في التطبيق" />
    <meta name="twitter:description" content="اضغط هنا للفتح داخل التطبيق." />
    <meta name="twitter:image" content="https://marminasorial-rgb.github.io/p/preview.png" />

    <title>جاري فتح التطبيق...</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f9;
            color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            padding: 35px 25px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 420px;
            width: 100%;
        }
        .icon {
            font-size: 50px;
            margin-bottom: 15px;
        }
        h2 {
            font-size: 20px;
            margin-bottom: 10px;
            color: #1a252f;
        }
        p {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px 20px;
            background-color: #007bff;
            color: #ffffff;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            box-shadow: 0 4px 12px rgba(0,123,255,0.25);
            transition: background-color 0.2s ease;
        }
        .btn:active {
            background-color: #0056b3;
        }
        .btn.secondary {
            margin-top: 12px;
            background-color: #34c759;
            box-shadow: 0 4px 12px rgba(52,199,89,0.25);
        }
        .btn.secondary:active { background-color: #279e46; }
        .hint {
            margin-top: 18px;
            font-size: 12px;
            color: #b0b8bf;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">🚀</div>
        <h2>جاري تحويلك للتطبيق...</h2>
        <p>إذا لم يفتح التطبيق تلقائياً خلال ثوانٍ، اضغط على الزر هنا للفتح المباشر.</p>
        <a id="openBtn" href="#" class="btn">فتح التطبيق الآن</a>
        <a id="storeBtn" href="#" class="btn secondary" style="display:none;">تنزيل التطبيق من المتجر</a>
        <div class="hint" id="hint"></div>
    </div>

    <script>
        (function () {
            const urlParams = new URLSearchParams(window.location.search);
            const rawId = urlParams.get('id');

            // اسم الحزمة الرسمي للتطبيق
            const packageName = "io.kodular.drjohnyoussef.kedma";
            // رابط جوجل بلاي (يُستخدم كـ fallback لو التطبيق مش متثبت)
            const playStoreUrl = "https://play.google.com/store/apps/details?id=" + packageName;

            const openBtn = document.getElementById('openBtn');
            const storeBtn = document.getElementById('storeBtn');
            const hint = document.getElementById('hint');

            if (!rawId || rawId.trim() === "") {
                // مفيش id في اللينك أصلاً -> روح للصفحة الرئيسية
                window.location.href = "https://marminasorial-rgb.github.io/";
                return;
            }

            const encodedId = encodeURIComponent(rawId);
            const fullUrl = "https://marminasorial-rgb.github.io/p?id=" + encodedId;

            // ------------------------------------------------------------------
            // خط دفاع تالت مستقل تمامًا عن الـ StartValue/StartText:
            // بننسخ الـ id للـ Clipboard ببادئة مميزة (KEDMA_ID::) قبل ما نفتح
            // التطبيق. التطبيق بعدين بيقرا الكليبورد في Screen1.Initialize
            // (Clipboard.GetText) بدل ما يعتمد على StartValue وحدها، لأن
            // Clipboard مكون أصلي في كودولار مش محتاج Extension، ومش عنده
            // نفس مشكلة الـ Bug بتاعة StartValue/Get Plain Start Text.
            // البادئة KEDMA_ID:: مهمة جدًا عشان التطبيق يقدر يميز إن القيمة
            // دي جايالها من اللينك ده تحديدًا، مش أي نص تاني اتنسخ قبل كده
            // بالصدفة على نفس الجهاز.
            // ------------------------------------------------------------------
            const clipboardPayload = "KEDMA_ID::" + rawId;
            function copyIdToClipboard() {
                try {
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(clipboardPayload).catch(function () {});
                    }
                } catch (e) { /* تجاهل أي خطأ صامت، الطرق التانية هتكمل شغلها */ }
            }

            const intentUrl =
                "intent://marminasorial-rgb.github.io/p?id=" + encodedId +
                "#Intent;" +
                "scheme=https;" +
                "package=" + packageName + ";" +
                "category=android.intent.category.BROWSABLE;" +
                "category=android.intent.category.DEFAULT;" +
                "S.APP_INVENTOR_START=" + encodedId + ";" +
                "S.browser_fallback_url=" + encodeURIComponent(playStoreUrl) + ";" +
                "end";

            openBtn.href = intentUrl;
            storeBtn.href = playStoreUrl;
            // كل ضغطة يدوية على الزرار بتنسخ القيمة تاني (بعض المتصفحات
            // بتمنع الكتابة التلقائية للكليبورد من غير لمسة مستخدم فعلية)
            openBtn.addEventListener('click', copyIdToClipboard);

            let appOpened = false;

            // لو المستخدم سابح الصفحة (اتنقل فعلاً للتطبيق) هنعتبرها نجحت
            document.addEventListener('visibilitychange', function () {
                if (document.hidden) appOpened = true;
            });
            window.addEventListener('pagehide', function () {
                appOpened = true;
            });

            // ننسخ للكليبورد الأول قبل أي تنقّل
            copyIdToClipboard();

            // المحاولة الأولى: تلقائيًا فور تحميل الصفحة
            window.location.href = intentUrl;

            // لو بعد ثانيتين لسه في نفس الصفحة (يعني فشلت المحاولة، غالبًا
            // لأن المتصفح/الـ in-app browser مش فاهم صيغة intent://)
            // نجرب طريقة تانية: نفتح نفس الرابط https مباشرة (من غير غلاف
            // intent://)، بعض المتصفحات بتتعامل معاه كـ App Link عادي.
            setTimeout(function () {
                if (appOpened || document.hidden) return;
                copyIdToClipboard();
                window.location.href = fullUrl;
            }, 2000);

            // لو بعد 4 ثواني التطبيق لسه ما اتفتحش، غالبًا مش متثبت،
            // فبنظهر زرار التحميل من المتجر تلقائيًا.
            setTimeout(function () {
                if (appOpened || document.hidden) return;
                storeBtn.style.display = 'block';
                hint.textContent = 'لو التطبيق مش متثبت عندك، حمّله من هنا.';
            }, 4000);
        })();
    </script>

</body>
</html>
