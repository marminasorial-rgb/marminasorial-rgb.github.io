<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- وسوم المعاينة والصورة في واتساب وفيسبوك -->
    <meta property="og:title" content="افتح المحتوى في التطبيق" />
    <meta property="og:description" content="اضغط هنا للفتح المباشر داخل التطبيق." />
    <meta property="og:image" content="https://marminaserial-rgb.github.io/assets/preview.png" />
    <meta property="og:url" content="https://marminaserial-rgb.github.io/p/" />
    <meta property="og:type" content="website" />

    <title>جاري فتح التطبيق...</title>
</head>
<body style="text-align:center; font-family:sans-serif; padding-top:20vh; direction:rtl;">
    <h2>جاري توجيهك إلى التطبيق...</h2>
    <p>إذا لم يفتح التطبيق تلقائياً، اضغط على الزر أدناه:</p>
    
    <a id="openBtn" href="#" style="display:inline-block; padding:12px 24px; background-color:#007bff; color:#fff; text-decoration:none; border-radius:8px; font-weight:bold; margin-top:15px;">فتح التطبيق الآن</a>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const targetId = urlParams.get('id');
        
        // اسم الحزمة الحقيقي من واقع تطبيقك
        const packageName = "io.kodular.drjohnyoussef.v1743"; 

        if (targetId) {
            // صيغة الـ Intent الدقيقة المتوافقة مع متصفح كروم
            const intentUrl = `intent://p?id=${targetId}#Intent;scheme=https;package=${packageName};f=335544320;S.APP_INVENTOR_START=${targetId};end`;
            
            document.getElementById('openBtn').href = intentUrl;
            window.location.href = intentUrl;
        } else {
            window.location.href = "https://marminaserial-rgb.github.io/";
        }
    </script>
</body>
</html>
